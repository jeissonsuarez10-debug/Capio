function monthSelect(){return `<div class="month-nav">${button('','prevMonth','left','icon-only',`aria-label="Mes anterior" ${selected===(data.months[0]?.key||today().slice(0,7))?'disabled':''}`)}<select id="monthSelect" aria-label="Mes">${data.months.map(m=>`<option value="${m.key}" ${m.key===selected?'selected':''}>${monthLabel(m.key)}</option>`).join('')}</select>${button('','nextMonth','right','icon-only',`aria-label="Mes siguiente" ${selected===(data.months.at(-1)?.key||today().slice(0,7))?'disabled':''}`)}</div>`}
function kpi(label,n,foot,ic,highlight=false){return `<section class="card kpi ${highlight?'highlight':''}"><div class="kpi-top"><span>${label}</span>${icon(ic)}</div><div class="kpi-value ${money(n).length>14?'long':''} ${n<0&&!highlight?'negative':''}">${money(n)}</div><div class="kpi-foot">${foot}</div></section>`}
function dashboard(){
 const ms=periodMonths(),s=metrics(ms),period=scope==='all'?'Todo el historial':scope==='year'?'Año '+year:monthLabel(selected),years=[...new Set(data.months.map(m=>m.key.slice(0,4)))],rank={};s.rows.forEach(e=>{if(e.amount!==null){const key=e.name.toLowerCase().trim();rank[key]??={name:e.name,amount:0};rank[key].amount+=e.amount}});const top=Object.values(rank).sort((a,b)=>b.amount-a.amount).slice(0,5);
 const trendMonths=scope==='year'?data.months.filter(m=>m.key.startsWith(year)):scope==='all'?data.months:data.months.filter(m=>m.key<=selected).slice(-8),share=s.total?s.fixed/s.total*100:0;
 return head('Tu panorama financiero',`Cada mes cuenta. Así se distribuyen tus ingresos y gastos.`,button('Nuevo mes','newMonth','plus','primary'))+`<div class="section-tools"><div class="segments" aria-label="Periodo del dashboard">${[['month','Mensual'],['year','Anual'],['all','Histórico']].map(([v,n])=>`<button data-scope="${v}" class="${scope===v?'active':''}" aria-pressed="${scope===v}">${n}</button>`).join('')}</div>${scope==='month'?monthSelect():scope==='year'?`<select id="yearSelect" aria-label="Año">${years.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select>`:`<span class="subtitle">${monthLabel((data.months[0]?.key||today().slice(0,7)))} — ${monthLabel((data.months.at(-1)?.key||today().slice(0,7)))} · ${ms.length} meses</span>`}</div>
 <div class="kpis">${kpi(scope==='month'?'Ingresos del mes':'Ingresos acumulados',s.inc,scope==='month'?'Ingresos registrados en el mes':ms.length+' meses registrados','up')}${kpi(scope==='month'?'Gastos del mes':'Gastos acumulados',s.total,'Montos registrados · todos los estados','down')}${kpi('Después de pagos',s.balance,'Ingresos − gastos registrados','wallet',true)}${kpi('Promedio mensual',s.avg,scope==='month'?'Corresponde al mes seleccionado':'Total de gastos ÷ '+ms.length+' meses','chart')}</div>
 <div class="main-grid"><section class="card"><div class="card-head"><div><h2>Ingresos y gastos</h2><p class="subtitle">${scope==='month'?'Evolución hasta '+monthLabel(selected).toLowerCase():period+' · evolución mensual'}</p></div><div class="chart-legend"><span><i class="legend-dot" style="background:#b5bec8"></i>Ingresos</span><span><i class="legend-dot"></i>Gastos</span></div></div><div class="chart-box">${trend(trendMonths)}</div><div class="chart-footer"><span>${trendMonths.length} meses en el gráfico</span><span>Selecciona un punto para <strong>ver ese mes</strong></span></div></section>

function trend(months){
 if(!months.length)return '<p class="muted">Sin meses en este periodo.</p>';
 const W=660,H=230,L=51,R=12,T=16,B=33,vals=months.map(m=>({...metrics([m]),key:m.key})),max=Math.max(...vals.flatMap(x=>[x.inc,x.total]),1)*1.12,x=i=>L+(months.length===1?(W-L-R)/2:i*(W-L-R)/(months.length-1)),y=n=>T+(H-T-B)*(1-n/max),line=key=>vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(v[key]).toFixed(1)).join(' '),area=line('total')+`L${x(vals.length-1)},${H-B}L${x(0)},${H-B}Z`,step=Math.max(1,Math.ceil(vals.length/7));
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico mensual de ingresos y gastos en pesos colombianos"><defs><linearGradient id="fillChart" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#64788d" stop-opacity=".18"/><stop offset="100%" stop-color="#64788d" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>{const n=max*i/3;return `<line x1="${L}" y1="${y(n)}" x2="${W-R}" y2="${y(n)}" stroke="#e9ebee" stroke-dasharray="3 4"/><text x="${L-10}" y="${y(n)+3}" text-anchor="end" fill="#909ead" font-size="10">${compact(n)}</text>`}).join('')}<path d="${area}" fill="url(#fillChart)"/><path d="${line('inc')}" fill="none" stroke="#b5bec8" stroke-width="2" stroke-dasharray="5 4"/><path d="${line('total')}" fill="none" stroke="#3d4f62" stroke-width="2.5" stroke-linejoin="round"/>${vals.map((v,i)=>`<g><circle cx="${x(i)}" cy="${y(v.total)}" r="${vals.length>15?2.5:4}" fill="${v.key===selected?'#3d4f62':'#fff'}" stroke="#3d4f62" stroke-width="2"/><circle data-chart-month="${v.key}" tabindex="0" role="button" aria-label="Abrir ${monthLabel(v.key)}, gastos ${money(v.total)}, ingresos ${money(v.inc)}" cx="${x(i)}" cy="${y(v.total)}" r="10" fill="transparent" style="cursor:pointer"><title>${monthLabel(v.key)}: ingresos ${money(v.inc)} · gastos ${money(v.total)}</title></circle>${i%step===0||i===vals.length-1?`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#8695a5" font-size="10">${shortMonth(v.key)}</text>`:''}</g>`).join('')}</svg>`;
}

function emptyMonth(key=today().slice(0,7)){return {key,expenses:[],incomes:[],note:'',source:null,incomeAnalysis:{base:null,review:false,method:'manual',note:''}}}

function loanPlan(l){const end=l.installments===null?monthAdd(l.firstMonth>today().slice(0,7)?l.firstMonth:today().slice(0,7),11):monthAdd(l.firstMonth,l.installments-1),keys=new Set(debtPayments(l.id).map(x=>x.month));if(l.state!=='closed'){const start=l.installments===null?(l.firstMonth>today().slice(0,7)?l.firstMonth:today().slice(0,7)):l.firstMonth;for(let k=start,n=0;k<=end&&n<1200;k=monthAdd(k,1),n++)if(loanActiveIn(l,k))keys.add(k)}return [...keys].sort().map(key=>{const records=debtPayments(l.id).filter(x=>x.month===key).map(x=>x.e),active=loanActiveIn(l,key),scheduled=active?loanRate(l,key):null,recorded=records[0]||null;return {key,installment:Math.max(1,monthDistance(l.firstMonth,key)+1),scheduled,amount:records.length?sum(records,e=>e.amount):scheduled,paid:sum(records,e=>['pagado','parcial'].includes(e.status)?e.paid:0),records,recorded,loan:l}})}
function financeInputs(l={}){return `<div class="field-grid">${inputField('Nombre de la deuda','loanName',l.name||'','text','maxlength="200"','Ej. Crédito de la moto, Icetex o préstamo personal.')}${inputField('Entidad o prestamista','creditor',l.creditor||'','text','maxlength="200"')}${selectField('Estado de la deuda','loanState',[['active','En pago'],['closed','Ya terminada / pagada']],l.state||'active')}${inputField('Último mes de la deuda terminada','closedOn',l.closedOn||'','month','max="'+today().slice(0,7)+'"','Solo si ya la terminaste de pagar.')}${inputField('Cuota mensual (COP)','installmentAmount',l.rates?.[0]?.amount,'number','min="0.01" step="0.01"','Obligatoria para una deuda en pago; opcional si ya terminó.')}${inputField('Cantidad de cuotas (opcional)','installments',l.installments??'','number','min="1" max="600" step="1"','Déjalo vacío si no tienes un plazo definido.')}${inputField('Mes de la primera cuota','firstMonth',l.firstMonth||today().slice(0,7),'month','required min="2000-01" max="2100-12"')}${inputField('Día habitual de pago','loanDay',l.day||1,'number','min="1" max="31"')}${inputField('Monto prestado original (opcional)','financedAmount',l.financedAmount,'number','min="0" step="0.01"')}${inputField('Saldo de capital (opcional)','balance',l.balance,'number','min="0" step="0.01"','Para una deuda terminada se registra cero.')}${inputField('Fecha del saldo','balanceDate',l.balanceDate||today(),'date','required')}${inputField('Plataforma de pago','loanUrl',l.url||'','url')}${selectField('Pago ya presente en el catálogo','sourceTemplateId',[['','Crear una repetición nueva'],...data.templates.filter(t=>t.active&&!t.loanId&&!t.cardId).map(t=>[t.id,'Usar: '+t.name])],'')}</div><p class="help-copy" style="margin-top:14px">Puedes vincular pagos de cualquier mes después de crear la deuda. Una deuda terminada no genera cuotas nuevas. Sin cantidad de cuotas se proyectan los próximos 12 meses; la repetición continúa hasta que la finalices.</p>`}
function readLoan(f,assetId,fallbackName){const state=f.get('loanState')||'active',amount=getAmount(f.get('installmentAmount')||''),installments=f.get('installments')?Number(f.get('installments')):null,firstMonth=f.get('firstMonth'),day=Number(f.get('loanDay')||1),closedOn=f.get('closedOn')||'',url=(f.get('loanUrl')||'').trim();if(!['active','closed'].includes(state))throw Error('Elige el estado de la deuda.');if(state==='active'&&!(amount>0))throw Error('Indica una cuota mayor que cero.');if(installments!==null&&(!Number.isInteger(installments)||installments<1||installments>600))throw Error('Indica entre 1 y 600 cuotas o deja el campo vacío.');if(!validCardPeriod(firstMonth)||installments!==null&&monthAdd(firstMonth,installments-1)>'2100-12')throw Error('Revisa el periodo de cuotas.');if(state==='closed'&&(!validCardPeriod(closedOn)||closedOn<firstMonth||closedOn>today().slice(0,7)))throw Error('Indica el último mes de la deuda, entre su inicio y el mes actual.');if(!Number.isInteger(day)||day<1||day>31)throw Error('Indica un día entre 1 y 31.');if(url&&!safeURL(url))throw Error('Usa una plataforma http o https válida.');if(!validCardDate(f.get('balanceDate')))throw Error('Indica la fecha del saldo.');const sourceTemplateId=f.get('sourceTemplateId')||'';if(sourceTemplateId&&!data.templates.some(t=>t.id===sourceTemplateId&&t.active&&!t.cardId&&!t.loanId))throw Error('El gasto del catálogo no está disponible.');return {id:uid(),sourceTemplateId,assetId,name:(f.get('loanName')||fallbackName||'Deuda').trim(),creditor:(f.get('creditor')||'').trim(),firstMonth,installments,day,url,financedAmount:getAmount(f.get('financedAmount')||''),balance:state==='closed'?0:getAmount(f.get('balance')||''),balanceDate:f.get('balanceDate'),rates:[{from:firstMonth,amount:amount??0}],state,closedOn:state==='closed'?closedOn:'',stopFrom:state==='closed'?monthAdd(closedOn,1):null,notes:''}}
function changeRate(id){const l=data.loans.find(l=>l.id===id),first=monthAdd(today().slice(0,7),1),start=l.firstMonth>first?l.firstMonth:first,last=l.installments===null?'2100-12':monthAdd(l.firstMonth,l.installments-1);if(l.state==='closed'){toast('Esta deuda está terminada. Sus pagos se conservan.');return}openModal('Cambiar cuota · '+l.name,`<div class="notice info">${icon('info')}<span>Se actualizan las proyecciones y cuotas automáticas futuras sin pago. Las cuotas pagadas, parciales y editadas manualmente conservan sus valores.</span></div><div class="field-grid">${inputField('Desde el mes','from',start,'month',`required min="${start}" max="${last}"`)}${inputField('Nueva cuota','amount',loanRate(l,start),'number','required min="0.01" step="0.01"')}</div>`,f=>{const from=f.get('from'),amount=getAmount(f.get('amount'),true);if(!validCardPeriod(from)||from<start||from>last||l.stopFrom&&from>=l.stopFrom||amount<=0)throw Error('Revisa el mes futuro y el monto de la cuota.');mutate(()=>{l.rates=l.rates.filter(r=>r.from!==from);l.rates.push({from,amount});l.rates.sort((a,b)=>a.from.localeCompare(b.from));syncLoans(from)},'Cuota futura actualizada. Historial conservado.');closeModal()})}

function chartMonths(keys){const sorted=[...new Set(keys)].sort();if(!sorted.length)return [];const result=[];for(let k=sorted[0],n=0;k<=sorted.at(-1)&&n<1212;k=monthAdd(k,1),n++)result.push(k);return result}
function historyChart(rows,series,title){if(!rows.length)return '<div class="empty-state">No hay movimientos para graficar.</div>';const w=Math.max(640,rows.length*64+70),h=248,left=58,right=18,top=22,bottom=45,plot=h-top-bottom,max=Math.max(1,...rows.flatMap(r=>series.map(s=>r[s.key]||0))),step=(w-left-right)/rows.length,bw=Math.min(16,step/(series.length+1));return `<div class="chart-legend">${series.map(s=>`<span><i class="legend-dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div><div class="history-chart"><svg role="img" aria-label="${esc(title)}" viewBox="0 0 ${w} ${h}" style="min-width:${w}px"><title>${esc(title)}</title>${[0,.25,.5,.75,1].map(p=>`<line x1="${left}" y1="${top+plot*(1-p)}" x2="${w-right}" y2="${top+plot*(1-p)}" stroke="#dce5ef"/><text x="${left-9}" y="${top+plot*(1-p)+4}" text-anchor="end" fill="#607187" font-size="10">${compact(max*p)}</text>`).join('')}${rows.map((r,i)=>{const x=left+step*(i+.5);return `<g>${series.map((s,j)=>{const value=r[s.key]||0,bh=value/max*plot;return `<rect x="${x+(j-series.length/2)*bw}" y="${top+plot-bh}" width="${bw-2}" height="${bh}" rx="3" fill="${s.color}"><title>${shortMonth(r.key)} · ${esc(s.name)}: ${money(value)}</title></rect>`}).join('')}<text x="${x}" y="${h-20}" text-anchor="middle" fill="#607187" font-size="10">${shortMonth(r.key)}</text></g>`}).join('')}</svg></div><details class="chart-data"><summary>Ver valores del gráfico</summary><div class="table-scroll"><table><thead><tr><th>Mes</th>${series.map(s=>`<th class="money">${esc(s.name)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td>${monthLabel(r.key)}</td>${series.map(s=>`<td class="money">${money(r[s.key]||0)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`}
function valueBars(rows,empty='Sin movimientos para este mes.'){const max=Math.max(1,...rows.map(x=>x.value));return rows.length?rows.map(r=>`<div class="value-row"><div><span>${esc(r.name)}</span><strong>${money(r.value)}</strong></div><div class="value-track"><span style="width:${r.value/max*100}%;background:${r.color||'#367eb6'}"></span></div></div>`).join(''):`<p class="help-copy">${empty}</p>`}
function cardChartRows(){const ids=creditCard==='all'?null:[creditCard],all=cardStats(ids,null),charges=all.charges.filter(c=>creditConcept==='all'||c.name===creditConcept),keys=chartMonths([...all.charges.map(c=>c.period),...all.payments.map(x=>x.month)]);return keys.filter(k=>creditChartYear==='all'||k.startsWith(creditChartYear)).map(key=>({key,general:sum(all.payments.filter(x=>x.month===key),x=>x.e.amount),consumption:sum(charges.filter(c=>c.period===key),c=>c.amount)}))}
function cardCharts(){const all=cardStats(creditCard==='all'?null:[creditCard],null),names=[...new Set(all.charges.map(c=>c.name))].sort(),years=[...new Set([...all.charges.map(c=>c.period.slice(0,4)),...all.payments.map(p=>p.month.slice(0,4))])].sort();if(creditConcept!=='all'&&!names.includes(creditConcept))creditConcept='all';if(creditChartYear!=='all'&&!years.includes(creditChartYear))creditChartYear='all';const month=cardStats(creditCard==='all'?null:[creditCard],[creditPeriod]),grouped=breakdown(month.charges,x=>x.name,x=>x.name);return `<section class="card analytics-card"><div class="card-head"><div><h2>Histórico de tarjetas</h2><p class="subtitle">Pago general y consumo detallado por mes / extracto.</p></div></div><div class="filters chart-filters"><label>Consumo<select id="creditConcept"><option value="all">Todos los consumos</option>${names.map(n=>`<option value="${esc(n)}" ${creditConcept===n?'selected':''}>${esc(n)}</option>`).join('')}</select></label><label>Año<select id="creditChartYear"><option value="all">Todo el historial</option>${years.map(y=>`<option ${y===creditChartYear?'selected':''}>${y}</option>`).join('')}</select></label></div>${historyChart(cardChartRows(),[{key:'general',name:'Pago general registrado',color:'#173d69'},{key:'consumption',name:creditConcept==='all'?'Consumos detallados':creditConcept,color:'#55a9cf'}],'Histórico de tarjetas')}<p class="tiny muted">El pago general siempre muestra el total de la tarjeta seleccionada. La segunda serie puede filtrarse por consumo. Los meses sin registros se muestran en cero.</p></section><section class="card analytics-card"><div class="card-head"><div><h2>Consumo mensual · ${monthLabel(creditPeriod)}</h2><p class="subtitle">Compara el monto general y el detalle de cada consumo.</p></div><input id="creditMonthlyChartPeriod" type="month" value="${creditPeriod}" aria-label="Mes del gráfico" min="2000-01" max="2100-12"></div>${valueBars([{name:'Pago general registrado',value:month.billed,color:'#173d69'},{name:'Total de consumos detallados',value:month.consumption,color:'#55a9cf'}])}<div class="monthly-consumptions">${valueBars(grouped.map(g=>({name:g.name,value:g.amount})))}</div><p class="tiny muted">Estas barras se comparan; no se suman entre sí. Un consumo sin detallar no se inventa.</p></section>`}
function debtCharts(){const ps=debtPayments(debtFilter==='all'?null:debtFilter),keys=chartMonths(ps.map(x=>x.month)),rows=keys.map(key=>{const es=ps.filter(p=>p.month===key).map(p=>p.e);return {key,registered:sum(es,e=>e.amount),paid:sum(es,e=>['pagado','parcial'].includes(e.status)?e.paid:0)}}),mp=ps.filter(x=>x.month===debtPeriod),grouped=new Map();for(const {e} of mp){const name=loanRecord(e.loanId)?.name||e.loanName||'Deuda';grouped.set(name,(grouped.get(name)||0)+(['pagado','parcial'].includes(e.status)?e.paid||0:0))}return `<section class="card analytics-card"><h2>Histórico de pagos de deudas</h2><p class="subtitle">Por mes del registro · incluye pagos vinculados y deudas eliminadas.</p>${historyChart(rows,[{key:'registered',name:'Monto registrado',color:'#a4bfd7'},{key:'paid',name:'Pagado confirmado',color:'#236b9e'}],'Pagos históricos de deudas')}</section><section class="card analytics-card"><div class="card-head"><h2>Pagos por deuda · ${monthLabel(debtPeriod)}</h2><input type="month" id="debtChartPeriod" value="${debtPeriod}" aria-label="Mes de pagos de deudas"></div>${valueBars([...grouped].map(([name,value])=>({name,value})))}</section>`}
function debtsView(){const refs=[...data.loans,...data.removedLoans];if(debtFilter!=='all'&&!refs.some(l=>l.id===debtFilter))debtFilter='all';const ps=debtPayments(debtFilter==='all'?null:debtFilter).filter(x=>debtScope==='all'||x.month===debtPeriod),live=data.loans.filter(l=>debtFilter==='all'||l.id===debtFilter);return `<div class="toolbar"><div class="filters"><label>Deuda<select id="debtFilter"><option value="all">Todas las deudas</option>${refs.map(l=>`<option value="${esc(l.id)}" ${debtFilter===l.id?'selected':''}>${esc(l.name)}${data.removedLoans.some(r=>r.id===l.id)?' · eliminada':l.state==='closed'?' · terminada':''}</option>`).join('')}</select></label><label>Pagos<select id="debtScope"><option value="all" ${debtScope==='all'?'selected':''}>Todo el historial</option><option value="month" ${debtScope==='month'?'selected':''}>Mes del gráfico</option></select></label></div></div><div class="template-grid">${live.map(l=>{const paid=sum(debtPayments(l.id),x=>['pagado','parcial'].includes(x.e.status)?x.e.paid:0);return `<section class="card debt-card"><span class="pill ${l.state==='closed'?'paid':'pending'}">${l.state==='closed'?'Terminada / pagada':'En pago'}</span><h2>${esc(l.name)}</h2><p class="subtitle">${esc(l.creditor||'Prestamista sin indicar')}</p><div class="asset-stats"><div><span>Saldo de capital</span><strong>${money(l.balance)}</strong></div><div><span>Pagos confirmados</span><strong>${money(paid)}</strong></div></div><p class="tiny muted">Desde ${monthLabel(l.firstMonth)} · ${l.installments===null?'Sin cantidad de cuotas definida':l.installments+' cuotas'}${l.state==='closed'?' · Terminada en '+monthLabel(l.closedOn):l.stopFrom?' · Sin cuotas desde '+monthLabel(l.stopFrom):''}</p><div class="actions">${button('Vincular pagos anteriores','linkDebtPayments','layers','small primary',`data-id="${esc(l.id)}"`)}${button('Saldo y datos','editLoan','edit','small',`data-id="${esc(l.id)}"`)}${l.state!=='closed'?button('Cambiar cuota','changeRate','calendar','small',`data-id="${esc(l.id)}"`)+button('Ver proyección','viewLoan','chart','small',`data-id="${esc(l.id)}"`)+button('Deuda pagada','finishDebt','check','small',`data-id="${esc(l.id)}"`)+button('Detener cuotas futuras','stopLoan','x','small',`data-id="${esc(l.id)}"`):''}${button('Eliminar deuda','deleteLoan','trash','small danger',`data-id="${esc(l.id)}"`)}</div></section>`}).join('')||'<section class="card empty-state">No hay fichas de deuda en esta selección. Sus pagos anteriores, si existen, se conservan abajo.</section>'}</div><div class="analytics-grid">${debtCharts()}</div><section class="card table-card"><div class="table-head"><h2>Pagos vinculados</h2><span class="subtitle">${ps.length} registros</span></div><div class="table-scroll"><table><thead><tr><th>Mes</th><th>Deuda</th><th>Concepto</th><th class="money">Monto</th><th class="money">Pagado</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead><tbody>${ps.slice().sort((a,b)=>b.month.localeCompare(a.month)).map(({month,e})=>`<tr><td>${monthLabel(month)}</td><td>${esc(loanRecord(e.loanId)?.name||e.loanName)}</td><td>${esc(e.name)}</td><td class="money">${money(e.amount)}</td><td class="money">${money(e.paid)}</td><td>${statusLabels[e.status]}</td><td>${esc(e.paymentDate||'—')}</td><td><div class="row-actions">${e.amount!==null&&e.status!=='pagado'?button('Pagar','debtPay','check','small',`data-id="${esc(e.id)}"`):''}${button('Editar pago','debtEditPayment','edit','small',`data-id="${esc(e.id)}"`)}${button('Desvincular','unlinkDebtPayment','x','small',`data-id="${esc(e.id)}"`)}</div></td></tr>`).join('')||'<tr><td colspan="8">Vincula pagos anteriores para verlos aquí.</td></tr>'}</tbody></table></div></section><p class="help-copy" style="margin-top:15px">Los pagos no reducen automáticamente el saldo de capital: pueden incluir intereses y seguros. Eliminar una deuda retira su ficha y su proyección; conserva todos sus registros de pago.</p>`}
function deleteLoan(id){const l=data.loans.find(l=>l.id===id);openModal('Eliminar deuda · '+l.name,`<div class="notice">${icon('info')}<span><b>Eliminar no significa terminar de pagar.</b> Si ya la pagaste, puedes marcarla como terminada y conservar su ficha.</span></div><p class="help-copy">Eliminar retira la ficha, su saldo del patrimonio y la repetición futura. Todos los pagos y gastos ya registrados conservan su monto, estado, fecha y vínculo histórico. Se podrán consultar en Mis deudas con el filtro «eliminada».</p>${deletionCheck()}`,f=>{checkDeletion(f);mutate(()=>{data.removedLoans.push({id:l.id,name:l.name,deletedAt:today()});data.loans=data.loans.filter(x=>x.id!==id);data.templates=data.templates.filter(t=>t.loanId!==id);debtFilter=id},'Deuda eliminada. Historial conservado.');closeModal()},'Eliminar deuda')}
function profileForm(tab='profile'){profileTab=tab;const p=data.profile;openModal('Tu espacio en Capio',`<div class="profile-banner"><span class="profile-emblem">${icon('wallet')}</span><div><h2>${esc(p.name||'Tu perfil')}</h2><p>Capio · Finanzas personales</p></div></div><div class="segments profile-tabs">${[['profile','Perfil'],['files','Archivos y respaldo']].map(([k,n])=>`<button type="button" data-action="profileTab" data-id="${k}" class="${tab===k?'active':''}">${n}</button>`).join('')}</div>${tab==='files'?settingsView():`<p class="help-copy">Todos los datos son opcionales. Se guardan en esta aplicación y se incluyen en tus respaldos personales.</p><div class="field-grid">${inputField('Nombre completo','name',p.name,'text','maxlength="200"','',true)}${inputField('Fecha de nacimiento','birthDate',p.birthDate,'date',`max="${today()}"`)}${inputField('Lugar de nacimiento','birthPlace',p.birthPlace,'text','maxlength="200"')}${inputField('Ciudad de residencia','city',p.city,'text','maxlength="200"')}${inputField('Empresa / lugar de trabajo','workplace',p.workplace,'text','maxlength="200"')}${inputField('Profesión u ocupación','profession',p.profession,'text','maxlength="200"')}${inputField('Correo electrónico','email',p.email,'email','maxlength="200"')}${inputField('Teléfono','phone',p.phone,'tel','maxlength="50"')}<label class="field full">Otros datos / notas<textarea name="notes" maxlength="2000">${esc(p.notes)}</textarea></label></div>`}`,tab==='profile'?f=>{const obj=Object.fromEntries(Object.keys(emptyProfile()).map(k=>[k,(f.get(k)||'').trim()]));if(obj.birthDate&&(!validCardDate(obj.birthDate)||obj.birthDate>today()))throw Error('Revisa la fecha de nacimiento.');mutate(()=>data.profile=obj,'Perfil guardado.');closeModal()}:null,'Guardar perfil');$('#modal').classList.add('profile-dialog')}
function settingsView(){return `<div class="profile-files"><section class="card"><h2>Archivos y respaldo</h2><p class="help-copy">Descarga tu HTML para conservar una aplicación completa con tus datos. El respaldo JSON sirve para trasladarlos o restaurarlos. Los cambios se guardan en este navegador; no hay sincronización entre equipos.</p><div class="actions">${button('Descargar mi HTML','exportHTML','download','primary')}${button('Crear respaldo JSON','exportJSON','shield')}${button('Importar respaldo','importJSON','up')}</div></section><section class="card"><h2>Preferencias de registro</h2><div class="setting-row"><span>Día de pago<small>El conteo regresivo se muestra en el mes actual.</small></span><select id="dayMode"><option value="due" ${data.settings.dayMode==='due'?'selected':''}>Vencimiento</option><option value="reference" ${data.settings.dayMode==='reference'?'selected':''}>Referencia</option></select></div><p class="help-copy">El presupuesto suma cada gasto una vez. Los consumos detallados de tarjetas explican el pago general sin duplicarlo. Las proyecciones de deudas se muestran aparte; sus cuotas cuentan en el presupuesto al incorporarse a un mes.</p></section><section class="card reset-zone"><h2>Empezar de cero</h2><p class="help-copy"><b>Copia limpia:</b> genera un HTML sin perfil, meses, ingresos, gastos, pagos, bienes, deudas, tarjetas, catálogos ni datos originales. Tus cuentas actuales permanecen intactas.</p><div class="actions">${button('Descargar copia limpia','cleanCopy','download')}</div><p class="help-copy" style="margin-top:18px"><b>Borrar todo:</b> elimina esos datos de esta aplicación. No puede deshacerse desde el botón Deshacer. Para entregar la aplicación a otra persona, descarga el HTML limpio; borrar aquí no modifica copias que ya hayas descargado.</p>${button('Borrar todos mis datos','resetAll','trash','danger')}</section></div>`}
function cleanData(){return {schema:5,app:'Capio',storageKey:'capio-'+uid(),profile:emptyProfile(),months:[],templates:[],archive:[],settings:{dayMode:'due'},meta:{},assets:[],groups:[],loans:[],salaryRates:[],cards:[],cardCharges:[],cardPatterns:[],removedAssets:[],removedLoans:[],removedCards:[],updatedAt:new Date().toISOString()}}
function htmlForData(snapshot){const doc=document.documentElement.cloneNode(true);doc.querySelector('#seed').textContent=JSON.stringify(snapshot).replace(/</g,'\\u003c');doc.querySelector('#main').innerHTML='';doc.querySelector('#modal').removeAttribute('open');doc.querySelector('#modal').classList.remove('profile-dialog');for(const id of ['#modalBody','#modalTitle','#modalFoot','#toast'])doc.querySelector(id).textContent='';doc.querySelector('#toast').classList.remove('show');doc.querySelector('#historyCount').textContent=snapshot.months.length+' meses registrados';doc.querySelector('#profileLabel').textContent=snapshot.profile?.name||'Mi perfil';doc.querySelector('#storageError').classList.remove('show');doc.querySelector('#undoBtn').disabled=true;return '<!doctype html>\n'+doc.outerHTML}
function exportHTML(){download(htmlForData({...data,updatedAt:new Date().toISOString()}),'Capio_'+today()+'.html','text/html;charset=utf-8');toast('Capio descargado con tus datos actuales.')}
function cleanCopy(){openModal('Descargar Capio en limpio',`<p class="help-copy">La copia incluirá únicamente la aplicación, sin información personal ni financiera y sin datos de origen. Tendrá un espacio de guardado independiente. Tus cuentas actuales se conservan.</p><label class="check-field"><input type="checkbox" name="understood" required> Confirmo que quiero una aplicación vacía para compartir.</label>`,f=>{if(!f.has('understood'))throw Error('Confirma la descarga de una copia limpia.');const clean=cleanData();download(htmlForData(clean),'Capio_limpio.html','text/html;charset=utf-8');closeModal();toast('Copia limpia descargada. Tus cuentas se conservan.')},'Descargar copia limpia')}
function resetAll(){openModal('Borrar todos los datos de Capio',`<div class="notice danger-notice">${icon('info')}<span><b>Se borrarán todos los datos:</b> ${data.months.length} meses, ${data.months.flatMap(m=>m.expenses).length} gastos y pagos, ingresos, bienes, deudas, tarjetas, consumos, catálogos, perfil y datos originales. No se conserva historial de eliminados ni una copia para Deshacer.</span></div><div class="actions">${button('Descargar respaldo antes de borrar','exportJSON','shield')}</div>${inputField('Escribe BORRAR TODO para confirmar','confirm','','text','required autocomplete="off"')}<label class="check-field"><input type="checkbox" name="understood" required> Entiendo que solo podré recuperar mis datos si conservo un respaldo externo.</label>`,f=>{if(f.get('confirm')!=='BORRAR TODO'||!f.has('understood'))throw Error('Escribe BORRAR TODO y confirma la advertencia.');if(externalChange)throw Error('Otra pestaña cambió los datos. Recarga antes de borrar.');const oldKey=STORAGE,clean=cleanData();try{localStorage.setItem(oldKey,JSON.stringify(clean));localStorage.setItem(clean.storageKey,JSON.stringify(clean))}catch{throw Error('No se pudo completar el borrado en este navegador. Intenta de nuevo antes de cerrar.')}data=clean;STORAGE=clean.storageKey;undoData=null;Object.keys(SEED).forEach(k=>delete SEED[k]);Object.assign(SEED,clone(clean));$('#seed').textContent=JSON.stringify(clean);INCOME_ANALYSIS.months={};INCOME_ANALYSIS.segments=[];selected=today().slice(0,7);year=selected.slice(0,4);creditCard='all';debtFilter='all';projectionLoan='all';creditConcept='all';linkSelection.clear();debtLinkSelection.clear();linkCardId='';linkQuery='';linkPeriod='all';debtLinkId='';debtLinkQuery='';debtLinkMonth='all';query='';templateQuery='';assetFilter='all';groupFilter='all';statusFilter='all';kindFilter='all';creditScope='month';creditPeriod=selected;debtScope='all';debtPeriod=selected;creditChartYear='all';view='dashboard';persistError=false;closeModal();render();toast('Datos borrados. Puedes crear tu primer mes o descargar Capio en limpio.')},'Borrar definitivamente')}
function v5Action(action,id,target){switch(action){case'profile':profileForm();return true;case'profileTab':profileForm(id);return true;case'cleanCopy':cleanCopy();return true;case'resetAll':resetAll();return true;case'deleteMonth':deleteFutureMonth();return true;case'finishDebt':finishDebt(id);return true;case'linkDebtPayments':linkDebtPayments(id);return true;case'unlinkDebtPayment':unlinkDebtPayment(id);return true;case'debtPay':case'debtEditPayment':{const x=expenseById(id);selected=x.m.key;if(action==='debtPay')paymentForm(id);else expenseForm(id);return true}case'addExpense':case'incomes':case'fromTemplates':case'assetExpense':if(noMonth()){toast('Crea primero un mes para registrar movimientos.');newMonth();return true}return false;case'undo':if(undoData){data=undoData;undoData=null;selected=data.months.some(m=>m.key===selected)?selected:data.months.at(-1)?.key||today().slice(0,7);save('Último cambio deshecho.')}return true;default:return false}}
document.addEventListener('input',e=>{if(e.target.id==='debtPaymentSearch'){debtLinkQuery=e.target.value;$('#debtPaymentCandidates').innerHTML=debtCandidateList()}});
document.addEventListener('change',e=>{const el=e.target;
 if(el.id==='creditConcept'){creditConcept=el.value;render()}
 if(el.id==='creditChartYear'){creditChartYear=el.value;render()}
 if(el.id==='creditMonthlyChartPeriod'&&validCardPeriod(el.value)){creditPeriod=el.value;render()}
 if(el.id==='debtFilter'){debtFilter=el.value;render()}
 if(el.id==='debtScope'){debtScope=el.value;render()}
 if(el.id==='debtChartPeriod'&&validCardPeriod(el.value)){debtPeriod=el.value;render()}
 if(el.name==='debtPaymentPeriod'){debtLinkMonth=el.value;$('#debtPaymentCandidates').innerHTML=debtCandidateList()}
 if(el.id==='selectDebtPayments'){debtCandidates().forEach(x=>el.checked?debtLinkSelection.add(x.e.id):debtLinkSelection.delete(x.e.id));$('#debtPaymentCandidates').innerHTML=debtCandidateList()}
 if(el.dataset.debtExpense){el.checked?debtLinkSelection.add(el.dataset.debtExpense):debtLinkSelection.delete(el.dataset.debtExpense);$('#debtSelectionCount').textContent=debtLinkSelection.size+' seleccionados';const rows=debtCandidates();$('#selectDebtPayments').checked=rows.length>0&&rows.every(x=>debtLinkSelection.has(x.e.id))}
});
function editLoan(id){const l=data.loans.find(l=>l.id===id);openModal('Saldo y datos de '+l.name,`<div class="field-grid">${inputField('Nombre','name',l.name,'text','required maxlength="200"')}${inputField('Entidad o prestamista','creditor',l.creditor,'text','maxlength="200"')}${inputField('Cantidad de cuotas (opcional)','installments',l.installments,'number','min="1" max="600" step="1"','Vacío = sin plazo definido. Los pagos registrados se conservan.')}${inputField('Monto prestado original','financedAmount',l.financedAmount,'number','min="0" step="0.01"')}${inputField('Saldo de capital','balance',l.balance,'number','min="0" step="0.01"',l.state==='closed'?'Deuda terminada: saldo cero.':'Saldo según tu extracto.')}${inputField('Fecha del saldo','balanceDate',l.balanceDate,'date','required')}${inputField('Plataforma de pago','url',l.url,'url')}<label class="field full">Notas<textarea name="notes" maxlength="2000">${esc(l.notes)}</textarea></label></div>`,f=>{const name=f.get('name').trim(),url=f.get('url').trim(),installments=f.get('installments')?Number(f.get('installments')):null,balance=getAmount(f.get('balance'));if(!name||url&&!safeURL(url)||!validCardDate(f.get('balanceDate')))throw Error('Revisa el nombre, enlace y fecha.');if(l.state==='closed'&&balance!==0)throw Error('Una deuda terminada conserva saldo cero.');if(installments!==null&&(!Number.isInteger(installments)||installments<1||installments>600||l.rates.some(r=>r.from>monthAdd(l.firstMonth,installments-1))))throw Error('Revisa la cantidad de cuotas: debe incluir los cambios de tarifa programados.');mutate(()=>{Object.assign(l,{name,url,installments,creditor:f.get('creditor').trim(),financedAmount:getAmount(f.get('financedAmount')),balance,balanceDate:f.get('balanceDate'),notes:f.get('notes').trim()});syncLoanTemplate(l)},'Datos de deuda actualizados. Pagos anteriores conservados.');closeModal()})}
function syncLoans(from=today().slice(0,7)){for(const l of data.loans){syncLoanTemplate(l);for(const m of data.months){if(m.key<from||m.key<today().slice(0,7))continue;const existing=m.expenses.filter(e=>e.loanId===l.id);if(!loanActiveIn(l,m.key)){m.expenses=m.expenses.filter(e=>!(e.loanId===l.id&&e.loanManaged&&e.status==='pendiente'&&!(e.paid>0)));continue}if(!existing.length){m.expenses.push(loanExpense(l,m.key));continue}for(const e of existing)if(e.loanManaged&&e.status==='pendiente'&&!(e.paid>0)){e.amount=loanRate(l,m.key);e.day=l.day}}}}

render();
